name: CI

# Run these checks when a pull request is opened into main
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Check code style
        run: ruff check . --line-length 120 --select E,F,W --ignore E402,W292

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    env:
      MYPYPATH: src:src/1_data_engineering:src/2_model_training:src/3_inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy types-PyYAML
      - name: Check types
        run: mypy src --ignore-missing-imports --check-untyped-defs --explicit-package-bases

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:src/1_data_engineering:src/2_model_training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install test tools
        run: pip install pytest pyspark pyyaml
      - name: Run tests
        run: pytest tests -v
